<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>catetin.id</title>
<meta name="theme-color" content="#D9573B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="catetin.id">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F4; --card:#FFFFFF; --ink:#2B2433; --muted:#8A8178; --line:#EEE9E1; --soft:#F2EEE7;
  --tomat:#D9573B; --mustard:#E5A93A; --teal:#2E8C85; --navy:#2C3E6B; --maroon:#8C2F45; --sage:#7FA071; --plum:#6D4C7D; --pink:#E08F86; --sky:#5FA8C9;
  --acc:#D9573B; --acc-t:#D9573B24;
  --sh:0 1px 2px rgba(43,36,51,.04),0 6px 18px rgba(43,36,51,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- login ---------- */
#login .inp{text-align:left}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 22px;background:linear-gradient(180deg,#FCE6CC 0%,var(--bg) 48%);text-align:center}
.mark{width:84px;height:84px;border-radius:26px;background:var(--tomat);display:grid;place-items:center;box-shadow:var(--sh);position:relative;overflow:hidden}
.mark span{color:#fff;font-size:48px;font-weight:800;line-height:1;margin-top:-10px}
.mark i{position:absolute;left:0;right:0;bottom:0;height:13px;background:linear-gradient(90deg,var(--mustard) 0 33%,var(--teal) 33% 66%,var(--navy) 66%)}
.brand{font-size:36px;margin:18px 0 4px;letter-spacing:-.03em}
.brand span{color:var(--tomat)}
.tag{color:var(--muted);font-size:14px;margin-bottom:26px}
.box{width:100%;max-width:340px}
.login-msg{color:var(--muted);font-size:14px;min-height:22px}
.login-msg.err{color:var(--maroon);font-weight:600}
.who-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.who-pick button{padding:28px 10px;border-radius:22px;color:#fff;font-size:20px;font-weight:800;box-shadow:var(--sh)}
.gmail{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:var(--sh);font-weight:700;font-size:14px}

/* ---------- umum ---------- */
.btn{display:block;width:100%;padding:15px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;margin-top:18px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--soft);color:var(--ink);margin-top:10px}
.btn.danger{color:var(--maroon);background:#F6E4E6}
.btn.danger.armed{background:var(--maroon);color:#fff}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:14px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px;gap:10px}
.sec h3{font-size:18px}
.sec small{color:var(--muted);font-size:13px}
.sec>button{font-size:14px;font-weight:700;color:var(--acc)}
.label{display:block;font-size:13px;color:var(--muted);margin:16px 0 7px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);outline:none;-webkit-appearance:none;appearance:none;font-size:16px}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:70px;resize:vertical}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.pickbtn{display:flex;align-items:center;gap:10px;text-align:left}
.pickbtn .mid{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn .ph{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 8px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600}
.chip.plain{padding:7px 13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);background:var(--card);box-shadow:var(--sh)}
.pills button.on{background:var(--acc);color:#fff}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px}
.seg button{flex:1;padding:10px 4px;font-weight:700;font-size:14px;border-radius:999px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.ic{position:relative;display:inline-grid;place-items:center;flex:none;border-radius:14px;overflow:hidden;line-height:1;background:var(--soft)}
.ic.ini{color:#fff;font-weight:800;letter-spacing:.02em}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px}
.bar i.mid{background:var(--mustard)}
.bar i.over{background:var(--tomat)}
.in{color:var(--teal)} .out{color:var(--maroon)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}
.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;z-index:40;max-width:90%;text-align:center;box-shadow:var(--sh)}
main{max-width:600px;margin:0 auto;padding-bottom:130px}
.wrap{padding:0 16px}

/* ---------- header beranda ---------- */
.hero{background:var(--acc);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 64px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,var(--mustard) 0 25%,var(--sky) 25% 50%,var(--sage) 50% 75%,var(--pink) 75%);opacity:.9}
.hero .sun{position:absolute;right:-40px;top:-30px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:0 0 0 26px rgba(255,255,255,.05),0 0 0 52px rgba(255,255,255,.03)}
.h-top{display:flex;justify-content:space-between;align-items:center;position:relative}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.2);color:inherit}
.switch i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.hero .switch i{background:#fff!important}
.h-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.h-btn svg{width:20px;height:20px}
.hi{font-size:22px;font-weight:800;margin:14px 0 10px;position:relative}
.h-month{display:inline-flex;align-items:center;gap:4px;background:#fff;color:var(--ink);border-radius:999px;padding:4px;font-size:13px;font-weight:700;position:relative}
.h-month button{width:26px;height:26px;border-radius:50%;font-weight:800}
.h-month b{padding:0 6px}
.h-l{font-size:13px;opacity:.85;margin-top:16px;position:relative}
.h-v{display:flex;align-items:center;gap:10px;font-size:32px;font-weight:800;letter-spacing:-.02em;position:relative}
.eye{width:34px;height:34px;display:grid;place-items:center;flex:none;color:inherit}
.eye svg{width:22px;height:22px}
.h-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;position:relative}
.h-mini div{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.16);border-radius:16px;padding:10px 11px}
.h-mini .ar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px}
.h-mini small{display:block;font-size:11.5px;opacity:.85}
.h-mini b{font-size:14.5px;white-space:nowrap}

/* tombol cepat */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 2px;margin:-46px 16px 0;position:relative;padding:14px 8px 10px;background:var(--card);border-radius:24px;box-shadow:var(--sh)}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink);padding:4px 0;text-align:center;line-height:1.15}
.qa .qi{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px}
.qa .qi svg{width:22px;height:22px}

/* kartu wallet & lainnya */
.box-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.box-h h3{font-size:16px;flex:1}
.box-h .tot{font-weight:800;font-size:14px}
.round{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:20px;font-weight:700;line-height:1}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:800;white-space:nowrap}
.row .go{color:var(--muted);font-weight:700}
.feat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:20px;padding:14px;margin-bottom:10px}
.feat .fi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:21px;flex:none}
.feat .mid{flex:1;min-width:0}
.feat b{display:block;font-size:15px}
.feat small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.feat .go{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;font-weight:800;color:var(--muted)}

/* anggaran */
.ang{display:block;width:100%;text-align:left}
.ang+.ang{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.ang .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:2px}
.ang .t small{font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap}
.ang .s{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:6px 0 0}
.per{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:2px}

/* tile berwarna */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:block;width:100%;text-align:left;border-radius:22px;padding:16px 14px 14px;min-height:170px;box-shadow:var(--sh);overflow:hidden;cursor:pointer}
.bubble{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:29px;margin-bottom:12px;overflow:hidden;position:relative;color:var(--ink)}
.bubble img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .tg{position:absolute;top:14px;right:14px;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.22)}
.tile.light .tg{background:rgba(43,36,51,.08)}
.tn{font-size:15.5px;font-weight:800;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{font-size:18px;font-weight:800;margin-top:2px}
.ts{font-size:12.5px;opacity:.82;margin-top:1px}
.tbar{height:6px;border-radius:3px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden}
.tile.light .tbar{background:rgba(43,36,51,.1)}
.tbar i{display:block;height:100%;background:currentColor;border-radius:3px}
.tile-btn{margin-top:10px;padding:7px 15px;border-radius:999px;background:#fff;color:var(--ink);font-weight:800;font-size:13px}
.tile.add{background:transparent;border:2px dashed #DDD5C8;box-shadow:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tile.add .bubble{background:var(--soft);font-size:28px}

/* halaman biasa */
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--acc-t),rgba(250,248,244,.97) 80%),var(--bg)}
.ph h2{font-size:24px;letter-spacing:-.02em}
.ph .switch{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.ph .switch i{box-shadow:none}
.month{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 14px}
.month b{font-size:15px;min-width:140px;text-align:center}
.month button{width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:18px;font-weight:700;line-height:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.grid3 .card,.grid2 .card{margin:0;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.k2{font-size:12px;color:var(--muted);font-weight:600}
.v2{font-weight:800;font-size:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* transaksi */
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left}
.tx+.tx{border-top:1px solid var(--line)}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:800;white-space:nowrap;font-size:15px}
.day{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px;font-weight:700;display:flex;justify-content:space-between}

/* chat */
#chatlog{display:flex;flex-direction:column;gap:10px;padding:6px 0 10px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;font-size:15px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);box-shadow:var(--sh);border-bottom-left-radius:6px}
.msg .chips{margin-top:10px}
.msg .rec{display:flex;gap:10px;align-items:center;margin:6px 0}
.msg .note{font-size:13px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.msg .undo{font-size:13px;font-weight:700;color:var(--maroon);margin-top:8px}
.chatbar{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));padding:8px 12px 10px;background:rgba(250,248,244,.97);border-top:1px solid var(--line);z-index:6}
.chatbar .ex{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.chatbar .ex::-webkit-scrollbar{display:none}
.chatbar .ex button{flex:none;font-size:12.5px;padding:6px 11px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-weight:600}
.chatbar form{display:flex;gap:8px;max-width:600px;margin:0 auto}
.chatbar input{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);outline:none;font-size:16px}
.chatbar input:focus{border-color:var(--acc)}
.chatbar .send{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;font-size:20px;font-weight:800;flex:none}
.typing{opacity:.6;font-style:italic}

/* navigasi */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:7}
nav>button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:60px}
nav>button.on{color:var(--ink)}
nav>button.on svg{stroke:var(--acc)}
nav svg{width:25px;height:25px}
.fabwrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-34px;min-width:70px}
.fab{width:60px;height:60px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px var(--acc-t),var(--sh);border:4px solid #fff}
.fab svg{width:26px;height:26px;stroke-width:2.6}
.fab-chat{font-size:11px;font-weight:800;color:#fff;background:var(--ink);padding:3px 10px;border-radius:999px}
.fab-chat.on{background:var(--acc)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(43,36,51,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;background:var(--bg);border-radius:26px 26px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom));z-index:21;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 -6px 30px rgba(0,0,0,.12)}
.sheet.tall{height:92vh}
.grab{width:44px;height:5px;border-radius:3px;background:#D8D1C6;margin:0 auto 14px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sh-t{font-size:21px;font-weight:800}
.x{width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:18px;font-weight:700;flex:none}
.sh-sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.amount{width:100%;font-weight:800;font-size:34px;border:0;border-bottom:2px solid var(--line);background:transparent;padding:6px 0;outline:none;border-radius:0}
.amount:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:34px;height:34px;border-radius:50%}
.swatches button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.icon-edit{display:flex;align-items:center;gap:12px}
.icon-edit label{font-size:14px;font-weight:700;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer}
.icon-edit .up{background:var(--acc);border-color:var(--acc);color:#fff;padding:11px 16px}
.pv{position:sticky;top:-12px;z-index:3;box-shadow:0 8px 14px -12px rgba(43,36,51,.35);display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--soft);border-radius:24px;padding:20px 16px 16px;margin:4px 0 8px}
.pv .ic{box-shadow:var(--sh)}
.pv b{font-size:21px;margin-top:12px}
.pv small{color:var(--muted);font-size:13px;margin-top:2px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px}
.ib{aspect-ratio:1;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:#7A6E60}
.ib.on{background:var(--ink);color:#fff}
.cust{width:34px;height:34px;border-radius:50%;border:2px dashed #CFC6B8;display:grid;place-items:center;position:relative;overflow:hidden;color:var(--muted);font-weight:800;cursor:pointer}
.cust.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.cust input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-weight:600}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;margin:6px 0 12px;box-shadow:var(--sh)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}

/* ---------- berdua ---------- */
.bd-head{padding:calc(14px + env(safe-area-inset-top)) 16px 4px;text-align:center;background:linear-gradient(180deg,#F6E1E6,var(--bg) 90%)}

.cover{position:relative;display:block;width:86%;margin:22px auto 6px;background:#fff;padding:12px 12px 14px;border-radius:6px;box-shadow:0 10px 28px rgba(43,36,51,.14);transform:rotate(-1.4deg)}

.cv-h{display:block;font-size:12.5px;color:#A2566A;font-weight:600}
.tape{position:absolute;top:-12px;left:50%;width:110px;height:28px;margin-left:-55px;background:rgba(229,169,58,.42);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.status{position:relative;background:#F8E3E8;border-radius:10px;padding:18px 16px 16px;margin:24px 0 6px;box-shadow:var(--sh);transform:rotate(.6deg)}
.status .t2{left:auto;right:18px;margin:0;width:90px;background:rgba(224,143,134,.35);transform:rotate(3deg)}
.status b{display:block;color:var(--maroon);font-size:16px}

.st-btn{margin-top:12px;background:var(--maroon);color:#fff;font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:999px}
.ag{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0}

.ag-d b{font-size:19px}

.ag .s{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-l{font-size:11.5px;font-weight:800;color:var(--teal);background:#E2F0EE;padding:4px 8px;border-radius:999px;white-space:nowrap}

.card.soft{background:var(--soft);box-shadow:none}
.ag-past{display:flex;align-items:center;gap:10px;padding:8px 0}

.mini-btn{font-size:12.5px;font-weight:800;color:#fff;background:var(--maroon);padding:7px 11px;border-radius:999px;white-space:nowrap}
.tl{padding-bottom:6px}
.lnk{font-size:14px;font-weight:700;color:var(--maroon)}
.tl-row{display:flex;gap:14px;overflow-x:auto;margin:6px -16px 0;padding:10px 16px 16px;scrollbar-width:none}

.tl-row .pola{width:150px;flex:none}

.pn{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}

.pd{display:block;font-size:11.5px;color:var(--muted)}
.pola.add{border:2px dashed #E3C7CE;box-shadow:none;background:transparent}

.galeri{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:6px -16px 10px;padding:0 16px}

/* ---------- beranda baru ---------- */
.lift{margin-top:-46px;position:relative}
.h-sub{font-size:12.5px;opacity:.85;position:relative;margin-top:-2px}

.lnk2{color:var(--acc);font-weight:700;font-size:13.5px;white-space:nowrap}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.fl small{color:var(--muted);font-size:12px}

.fire2.off{filter:grayscale(1);opacity:.45}
.rows{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;margin:12px 0 8px}
.rl{font-size:12px;font-weight:700;color:var(--muted)}

.d7 i.ok{background:#2E8C85}
.d7 i.nol{background:#7FA071}
.d7 i.okb{background:#2C3E6B}
.d7 i.now{border:2px dashed var(--tomat);background:var(--card);line-height:22px}
.d7 i.now2{border:2px dashed #2C3E6B;background:var(--card);color:#2C3E6B;line-height:22px}
.tip{font-size:12.5px;background:#FFF6E3;border-radius:12px;padding:8px 10px;margin-bottom:10px;line-height:1.4}

.btns .b1{background:var(--acc);color:#fff}
.btns .b2{background:var(--soft);color:var(--ink)}
.btns .b2.on{background:#E2F0EE;color:#2E8C85}
.tot{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.tot b{color:var(--ink)}
.goals{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.goals::-webkit-scrollbar{display:none}
.g{flex:none;width:160px;border-radius:18px;padding:12px;background:color-mix(in srgb,var(--c) 10%,#fff);border:1.5px solid color-mix(in srgb,var(--c) 22%,#fff);text-align:left;cursor:pointer}
.g.add{background:transparent;border:2px dashed #DDD5C8;display:flex;flex-direction:column;justify-content:center;gap:2px}
.gt{display:flex;justify-content:space-between;align-items:center}
.gp{font-weight:800;font-size:13px;color:var(--c)}

.donut{display:flex;gap:14px;align-items:center}
.donut svg{flex:none}
.donut text,.chart text,.chart rect,.chart line{stroke:none}

.leg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bars7{display:flex;align-items:flex-end;gap:8px;height:136px}

.ins{display:flex;gap:10px;padding:9px 0;font-size:13.5px;line-height:1.4;align-items:flex-start}

.w.add{box-shadow:none;border:2px dashed #DDD5C8;background:transparent}

.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum3 div{border-radius:16px;padding:11px;color:#fff;min-width:0}
.sum3 small{font-size:11px;opacity:.9;display:block}
.sum3 b{font-size:14.5px;white-space:nowrap}
.legend2{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.top10 .r{display:flex;align-items:center;gap:10px;padding:9px 0;width:100%;text-align:left}
.top10 .r+.r{border-top:1px solid var(--line)}
.top10 .m{flex:1;min-width:0}

.top10 .v{font-weight:800;font-size:13px;text-align:right;white-space:nowrap}
.top10 .v small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.subl{margin:0 0 8px 46px;padding:6px 10px;background:var(--soft);border-radius:12px;font-size:12.5px}
.subl div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
/* ---------- tampilan ---------- */
.tg-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.tg-row span:first-child{flex:1}
.tg-row b{display:block;font-size:14.5px}
.tg-row small{color:var(--muted);font-size:12.5px}
.sw2{position:relative;width:46px;height:28px;border-radius:999px;background:#D8D1C6;flex:none;transition:background .2s}
.sw2 i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}

.krow{display:flex;align-items:center;gap:10px;padding:8px 0}
.krow+.krow{border-top:1px solid var(--line)}
.krow span{flex:1;font-weight:600;font-size:14px}
.mv{width:32px;height:32px;border-radius:10px;background:var(--soft);font-weight:800}

.pbaru{position:absolute;top:6px;left:6px;background:var(--maroon);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;font-family:'Plus Jakarta Sans',sans-serif}
nav>button{position:relative}

[data-rapat=ringkas] .card{padding:10px 12px;margin-bottom:10px;border-radius:18px}

<!-- LOGIN / MEMUAT -->
<section id="login">
  <div class="mark"><span>c</span><i></i></div>
  <h1 class="brand">catetin<span>.id</span></h1>
  <div class="tag">Catatan keuangan berdua</div>
  <div class="box">
    <div class="login-msg" id="login-msg">Memuat…</div>
    <div class="hidden" id="form-masuk">
      <input class="inp" id="lg-email" type="email" inputmode="email" autocomplete="email" placeholder="Email">
      <input class="inp" id="lg-sandi" type="password" autocomplete="current-password" placeholder="Kata sandi" style="margin-top:10px">
      <button class="btn" data-act="lg-masuk" id="lg-btn">Masuk</button>
      <button class="btn ghost" data-act="lg-mode" data-v="daftar">Belum punya / lupa kata sandi</button>
    </div>
    <div class="hidden" id="form-daftar">
      <div class="hint" style="margin-bottom:10px">Buat atau ganti kata sandi memakai kode undangan.</div>
      <input class="inp" id="dt-email" type="email" inputmode="email" autocomplete="email" placeholder="Email">
      <input class="inp" id="dt-sandi" type="password" autocomplete="new-password" placeholder="Kata sandi baru (min. 6 karakter)" style="margin-top:10px">
      <input class="inp" id="dt-sandi2" type="password" autocomplete="new-password" placeholder="Ulangi kata sandi" style="margin-top:10px">
      <input class="inp" id="dt-kode" autocomplete="off" autocapitalize="characters" placeholder="Kode undangan" style="margin-top:10px">
      <button class="btn" data-act="dt-simpan" id="dt-btn">Simpan & masuk</button>
      <button class="btn ghost" data-act="lg-mode" data-v="masuk">‹ Kembali ke Masuk</button>
    </div>
    <div class="hidden" id="step-who">
      <div class="gmail" id="who-email"></div>
      <div class="label" style="margin-top:18px">Ini akun siapa?</div>
      <div class="who-pick" id="who-list"></div>
      <div class="hint" style="margin-top:12px">Pilihan ini mengikat email tersebut ke akun yang dipilih.</div>
    </div>
    <button class="btn hidden" id="btn-retry" data-act="retry">Coba lagi</button>
  </div>
</section>

<!-- APLIKASI -->
<section id="app" class="hidden">
  <main id="view"></main>
  <div class="chatbar hidden" id="chatbar">
    <div class="ex" id="chat-ex"></div>
    <form id="chat-form" autocomplete="off">
      <input id="chat-in" placeholder="cth: beli bensin 20rb pake tunai" enterkeyhint="send">
      <button class="send" type="submit" aria-label="Kirim">↑</button>
    </form>

  var isTrf = /\s(tarik tunai|tarik|transfer|tf|pindah|setor|setoran|nyetor|nabung|menabung|tabung|topup|top up|isi saldo)\s/.test(t);
  var isMasuk = !isTrf && /\s(gaji|gajian|bonus|thr|terima|nerima|dapat|dapet|pemasukan|cair|insentif|tunjangan)\s/.test(t);
  if (isTrf) p.jenis = 'Transfer'; else if (isMasuk) p.jenis = 'Pemasukan';

  var cand = p.jenis === 'Transfer'
    ? S.cfg.dompet.filter(function(d){ return d.akun === base || (A[d.akun] && A[d.akun].bersama); })
    : dompetAkun(akunId);
  var hits = [];
  cand.forEach(function(d){ var c = cocok(t, [d.nama].concat(d.kata || [])); if (c) hits.push({d:d, pos:c.pos, len:c.len}); });
  hits.sort(function(a, b){ return a.pos - b.pos || b.len - a.len; });
  hits = hits.filter(function(x, i){ for (var j = 0; j < i; j++){ var y = hits[j]; if (x.pos < y.pos + y.len + 1 && y.pos < x.pos + x.len + 1) return false; } return true; });

  var tHit = null;
  S.cfg.target.forEach(function(tg){
    var ta = targetAkun(tg); if (ta !== base && !(A[ta] && A[ta].bersama)) return;
    var c = cocok(t, [tg.nama].concat(tg.kata || [])); if (c && (!tHit || c.len > tHit.len)) tHit = {tg:tg, len:c.len};
  });

  if (p.jenis === 'Transfer') {
    var milikBase = hits.filter(function(x){ return x.d.akun === base; });
    var milikBersama = hits.filter(function(x){ return A[x.d.akun] && A[x.d.akun].bersama; });
    if (/\starik( tunai)?\s/.test(t)) {
      var bank = milikBase.filter(function(x){ return x.d.jenis !== 'tunai'; })[0];
      var tunai = dompetAkun(base).filter(function(d){ return d.jenis === 'tunai'; })[0];
      if (bank) p.dompet = bank.d.id; if (tunai) p.tujuan = tunai.id;
    } else if (/\s(setor|setoran|nyetor|nabung|menabung|tabung)\s/.test(t) || tHit) {
      var bersama = akunBersama(), tuj = null;
      if (tHit && dompetTarget(tHit.tg)) tuj = dompetTarget(tHit.tg);
      else tuj = milikBersama[0] ? milikBersama[0].d : (bersama ? dompetAkun(bersama.id)[0] : null);
      if (tuj) p.tujuan = tuj.id;
      var asal = milikBase.filter(function(x){ return !tuj || x.d.id !== tuj.id; })[0];
      if (asal) p.dompet = asal.d.id;
      if (tHit) p.target = tHit.tg.id;
    } else {
      var keIdx = t.indexOf(' ke ');
      if (hits.length >= 2) {
        var to = hits.filter(function(x){ return keIdx >= 0 && x.pos > keIdx; })[0] || hits[1];
        var from = hits.filter(function(x){ return x !== to; })[0];
        p.dompet = from.d.id; p.tujuan = to.d.id;
      } else if (hits.length === 1) {
        if (keIdx >= 0 && hits[0].pos > keIdx) p.tujuan = hits[0].d.id; else p.dompet = hits[0].d.id;
      }
    }
    if (p.dompet && D[p.dompet]) p.akun = D[p.dompet].akun;
    return p;
  }

  if (hits[0]) p.dompet = hits[0].d.id;

  var cariSub = function(tipe){
    var best = null;
    kantongAkun(akunId, tipe).forEach(function(k){
      (k.sub || []).forEach(function(s){ var c = cocok(t, [s.nama].concat(s.kata || [])); if (c && (!best || c.len > best.len)) best = {s:s, k:k, len:c.len}; });
    });
    return best;
  };
  var tipe = p.jenis === 'Pemasukan' ? 'masuk' : 'keluar';
  var sh = cariSub(tipe);

  var tk = null;
  S.cfg.toko.forEach(function(o){ var c = cocok(t, [o.nama].concat(o.kata || [])); if (c && (!tk || c.len > tk.len)) tk = {o:o, len:c.len}; });

      kantongAkun(akunId, tipe).forEach(function(k){ (k.sub || []).forEach(function(s){ if (!sh && s.nama.toLowerCase() === String(tk.o.subNama).toLowerCase()) sh = {s:s, k:k}; }); });
    }
  }
  if (sh) { p.sub = sh.s.id; p.kantong = sh.k.id; }
  else {
    var buang = {};
    hits.forEach(function(x){ [x.d.nama].concat(x.d.kata || []).forEach(function(k){ norm(k).trim().split(' ').forEach(function(w){ buang[w] = 1; }); }); });
    if (tk) [tk.o.nama].concat(tk.o.kata || []).forEach(function(k){ norm(k).trim().split(' ').forEach(function(w){ buang[w] = 1; }); });
    var kata = t.trim().split(' ').filter(function(w){ return w && !/\d/.test(w) && STOP.indexOf(w) < 0 && !buang[w]; });
    p.learn = kata.slice(0, 3).join(' ');
  }
  return p;
}

/* =========================================================
   TABUNGAN, STREAK & BERANDA BARU
   ========================================================= */
function targetAkun(t){ return (t && t.akun) || 'bersama'; }
function targetMilik(a){ return S.cfg.target.filter(function(t){ return targetAkun(t) === a; }); }
function targetUntuk(did){

}
function dompetTarget(t){
  if (t.dompet && D[t.dompet]) return D[t.dompet];
  var a = targetAkun(t); if (A[a] && A[a].bersama) return dompetAkun(a)[0] || null;
  return null;
}
function totalTabungan(a){ return targetMilik(a).reduce(function(x, t){ return x + Math.max(0, progresTarget(t.id)); }, 0); }
function geserTgl(s, n){ var d = tglObj(s); d.setDate(d.getDate() + n); return tglStr(d); }
function senin(s){ var d = tglObj(s), k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return tglStr(d); }

/* streak mencatat (harian) */
function hariCatat(a){
  var set = {}, bersama = A[a] && A[a].bersama;
  S.tx.forEach(function(t){ if (t.akun === a || (bersama && terkait(t, a))) set[t.tanggal] = 1; });
  ((S.cfg.nol || {})[a] || []).forEach(function(d){ if (!set[d]) set[d] = 2; });
  return set;
}
function streakHari(set){
  var d = today(); if (!set[d]) d = geserTgl(d, -1);
  var n = 0; while (set[d]) { n++; d = geserTgl(d, -1); }
  return n;
}
/* streak menabung (mingguan, Senin–Minggu) */
function setoranMinggu(a, mon){
  var akhir = geserTgl(mon, 6);
  return jumlahBy(S.tx, function(t){ return t.jenis === 'Transfer' && t.target && T[t.target] && targetAkun(T[t.target]) === a && t.tanggal >= mon && t.tanggal <= akhir; });
}
function ambangMinggu(a){
  var s = targetMilik(a).reduce(function(x, t){ var nom = Number(t.nominal) || 0; return x + ((nom && progresTarget(t.id) >= nom) ? 0 : (Number(t.mingguan) || 0)); }, 0);
  return s || 1;
}
function streakMinggu(a){
  var th = ambangMinggu(a), w = senin(today());
  if (setoranMinggu(a, w) < th) w = geserTgl(w, -7);
  var n = 0; while (setoranMinggu(a, w) >= th && n < 520) { n++; w = geserTgl(w, -7); }
  return n;
}

function kartuStreak(a){
  var set = hariCatat(a), nH = streakHari(set), punyaTarget = targetMilik(a).length > 0;
  var nM = punyaTarget ? streakMinggu(a) : 0, th = ambangMinggu(a), mon = senin(today()), t0 = today();
  var html = '<div class="card streakc"><div class="duo' + (punyaTarget ? '' : ' one') + '">' +
    '<div class="fl"><span class="fire2' + (nH ? '' : ' off') + '">🔥</span><div><b>' + nH + ' hari</b><small>rajin mencatat</small></div></div>' +
    (punyaTarget ? '<div class="fl fl2"><span class="fire2' + (nM ? '' : ' off') + '">🔥</span><div><b>' + nM + ' minggu</b><small>rajin nabung</small></div></div>' : '') + '</div>';

  }
  html += '</div>';
  if (punyaTarget) {
    html += '<div class="rl">Nabung</div><div class="d7">';
    for (var j = 4; j >= 0; j--) {
      var w = geserTgl(mon, -7 * j), ok = setoranMinggu(a, w) >= th, now = j === 0, dw = tglObj(w);
      html += '<span><i class="' + (ok ? 'okb' : now ? 'now2' : '') + '">' + (ok ? '✓' : now ? '?' : '') + '</i>' + (now ? 'Ini' : dw.getDate() + ' ' + BLN[dw.getMonth()]) + '</span>';
    }

    html += '<div class="tip">⚠️ ' + (setoranMinggu(a, mon) ? 'Setoran minggu ini kurang <b>' + rp(kurang) + '</b>.' : 'Minggu ini belum ada setoran.') + ' Nabung sebelum <b>Minggu, ' + tglPendek(minggu) + '</b> biar api tabungan tetap nyala.</div>';
  } else if (!set[t0] && nH) {

  }

    (set[t0] === 1 ? '<button class="b2" data-act="nav" data-v="chat">💬 Catat lewat chat</button>' :
     '<button class="b2' + (nolHariIni ? ' on' : '') + '" data-act="tidak-belanja">' + (nolHariIni ? '✓ Hari ini tidak belanja' : 'Hari ini tidak belanja') + '</button>') + '</div></div>';
  return html;

function kartuTabungan(a){
  var ts = targetMilik(a), mon = senin(today());
  var html = '<div class="card"><div class="h2r"><h3>' + (A[a].bersama ? 'Target Kita' : 'Tujuan Menabung') + '</h3><button class="lnk2" data-act="form-target" data-id="">+ Tujuan</button></div>';
  if (!ts.length) {
    return html + '<div class="hint" style="margin:0 0 10px">Sisihkan uang untuk tujuanmu. Mulai cepat:</div><div class="chips">' +
      [['Dana Darurat','shield','#2E8C85'],['Pendidikan','grad','#2C3E6B'],['Liburan','palm','#5FA8C9'],['Gadget','phone','#6D4C7D'],['Kendaraan','motor','#D9573B']].map(function(x){
        return '<button class="chip" data-act="target-cepat" data-v="' + x[0] + '|' + x[1] + '|' + x[2] + '">' + ico({icon:x[1], warna:x[2]}, 24) + x[0] + '</button>';
      }).join('') + '</div></div>';
  }
  var tot = totalTabungan(a), mingguIni = setoranMinggu(a, mon);
  html += '<div class="tot">Total ditabung <b class="num">' + uang(tot) + '</b> · minggu ini <b class="num">' + uang(mingguIni) + '</b></div><div class="goals">';
  ts.forEach(function(t){
    var w = t.warna || '#2E8C85', kumpul = Math.max(0, progresTarget(t.id)), nom = Number(t.nominal) || 0, p = nom ? Math.min(100, Math.round(kumpul / nom * 100)) : 0;
    var mg = Number(t.mingguan) || 0, sm = jumlahBy(S.tx, function(x){ return x.jenis === 'Transfer' && x.target === t.id && x.tanggal >= mon; });
    var dw = dompetTarget(t), status;
    if (nom && kumpul >= nom) status = '<div class="gw okk">🎉 Target tercapai!</div>';
    else if (mg) status = sm >= mg ? '<div class="gw okk">✓ Minggu ini ' + rp(sm) + '</div>' : '<div class="gw no">Minggu ini ' + (sm ? rp(sm) + ' dari ' : 'belum · target ') + rp(mg) + '</div>';
    else status = '<div class="gw">' + (sm ? '✓ Minggu ini ' + rp(sm) : 'tanpa target mingguan') + '</div>';
    html += '<div class="g" style="--c:' + h(w) + '" data-act="form-target" data-id="' + h(t.id) + '"><div class="gt">' + ico(t, 38) + (nom ? '<span class="gp">' + p + '%</span>' : '') + '</div>' +
      '<b>' + h(t.nama) + '</b><small class="num">' + (nom ? singkat(kumpul) + ' / ' + singkat(nom) : uang(kumpul)) + (dw ? ' · ' + h(dw.nama) : '') + '</small>' +
      (nom ? '<div class="gb"><i style="width:' + p + '%"></i></div>' : '<div class="gb"></div>') + status +
      '<button data-act="setor" data-id="' + h(t.id) + '">+ Setor</button></div>';
  });
  html += '<button class="g add" data-act="form-target" data-id=""><span class="ic" style="width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--muted)">' + svgIc('target', 20) + '</span><b>Tujuan baru</b><small>Dana darurat, pendidikan…</small></button>';
  return html + '</div></div>';
}
function singkat(n){
  n = Math.round(Number(n) || 0); if (S.hide) return 'Rp••••';
  if (Math.abs(n) >= 1e9) return 'Rp' + (n / 1e9).toFixed(1).replace('.0', '').replace('.', ',') + ' M';
  if (Math.abs(n) >= 1e6) return 'Rp' + (n / 1e6).toFixed(1).replace('.0', '').replace('.', ',') + ' jt';
  if (Math.abs(n) >= 1e3) return 'Rp' + Math.round(n / 1e3) + 'rb';
  return 'Rp' + n;
}

function kartuDonat(a, bulan){
  var keluar = jumlahBy(bulan, function(t){ return t.jenis === 'Pengeluaran'; });
  var html = '<div class="card"><div class="h2r"><h3>Ke mana uangmu ' + (S.month === ym(today()) ? 'bulan ini' : namaBulan(S.month)) + '?</h3><button class="lnk2" data-act="nav" data-v="laporan">Laporan ›</button></div>';
  if (!keluar) return html + '<div class="empty">Belum ada pengeluaran di bulan ini.</div></div>';
  var per = kantongAkun(a, 'keluar').map(function(k){ return {k:k, v:jumlahBy(bulan, function(t){ return t.kantong === k.id && t.jenis === 'Pengeluaran'; })}; })
    .filter(function(x){ return x.v > 0; }).sort(function(x, y){ return y.v - x.v; });
  var top = per.slice(0, 4), sisa = per.slice(4).reduce(function(x, y){ return x + y.v; }, 0);
  if (sisa) top.push({k:{id:'', nama:'Lainnya', warna:'#A8977F'}, v:sisa});
  var off = 25, seg = '';
  top.forEach(function(x){
    var p = x.v / keluar * 100;
    seg += '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="' + h(x.k.warna || '#A8977F') + '" stroke-width="6.5" stroke-dasharray="' + Math.max(0.01, p - 0.6).toFixed(2) + ' ' + (100 - Math.max(0.01, p - 0.6)).toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"' + (x.k.id ? ' data-act="kantong-detail" data-id="' + h(x.k.id) + '" style="cursor:pointer"' : '') + '/>';
    off -= p;
  });
  html += '<div class="donut"><svg width="128" height="128" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--soft)" stroke-width="6.5"/>' + seg +
    '<text x="21" y="19.5" text-anchor="middle" font-size="3.4" fill="var(--muted)">Keluar</text><text x="21" y="24.6" text-anchor="middle" font-size="4.6" font-weight="800" fill="var(--ink)">' + h(singkat(keluar).replace('Rp', '')) + '</text></svg>' +
    '<div class="leg">' + top.map(function(x){
      return '<button ' + (x.k.id ? 'data-act="kantong-detail" data-id="' + h(x.k.id) + '"' : '') + '><i style="background:' + h(x.k.warna || '#A8977F') + '"></i><span>' + h(x.k.nama) + '</span><b>' + Math.round(x.v / keluar * 100) + '%</b></button>';
    }).join('') + '</div></div></div>';
  return html;
}

function kartuTujuhHari(a){
  var hari = [], t0 = today(), mx = 0, tot = 0;
  for (var i = 6; i >= 0; i--) {
    var d = geserTgl(t0, -i), v = jumlahBy(S.tx, function(t){ return t.akun === a && t.tanggal === d && t.jenis === 'Pengeluaran'; });
    hari.push({d:d, v:v}); if (v > mx) mx = v; tot += v;
  }
  var html = '<div class="card"><div class="h2r"><h3>7 hari terakhir</h3><span class="muted2">rata-rata ' + singkat(tot / 7) + '</span></div>';
  if (!tot) return html + '<div class="empty">Belum ada pengeluaran 7 hari terakhir.</div></div>';
  html += '<div class="bars7">' + hari.map(function(x){
    var hh = mx ? Math.max(4, Math.round(x.v / mx * 96)) : 4;
    return '<div title="' + h(rp(x.v)) + '"><small class="num">' + (x.v ? singkat(x.v).replace('Rp', '') : '') + '</small><i class="' + (x.v === mx && mx ? 'hi2' : '') + '" style="height:' + hh + 'px"></i>' + HARI[tglObj(x.d).getDay()].slice(0, 3) + '</div>';
  }).join('') + '</div></div>';
  return html;
}

function insightList(a){
  var out = [], t0 = today();
  // perbandingan 7 hari vs 7 hari sebelumnya per kategori
  var r1 = [geserTgl(t0, -6), t0], r0 = [geserTgl(t0, -13), geserTgl(t0, -7)], best = null;
  kantongAkun(a, 'keluar').forEach(function(k){
    var v1 = jumlahBy(S.tx, function(t){ return t.akun === a && t.kantong === k.id && t.jenis === 'Pengeluaran' && t.tanggal >= r1[0] && t.tanggal <= r1[1]; });
    var v0 = jumlahBy(S.tx, function(t){ return t.akun === a && t.kantong === k.id && t.jenis === 'Pengeluaran' && t.tanggal >= r0[0] && t.tanggal <= r0[1]; });
    if (v0 >= 20000 && v1 > v0 * 1.2 && (!best || v1 - v0 > best.d)) best = {k:k, p:Math.round((v1 - v0) / v0 * 100), d:v1 - v0};
  });
  if (best) out.push(['📈', '#FBE3DD', '<b>' + h(best.k.nama) + '</b> 7 hari terakhir naik <b>' + best.p + '%</b> dari minggu sebelumnya.']);
  anggaranAkun(a).forEach(function(x){
    var bt = Number(x.batas) || 0; if (!bt) return;
    var pk = pakaiAng(x), p = Math.round(pk / bt * 100);
    if (p >= 100) out.push(['⚠️', '#FBE3DD', '<b>' + h(x.nama) + '</b> sudah lewat ' + rp(pk - bt) + ' dari batas ' + labelPer(x.periode, 2).toLowerCase() + '.']);
    else if (x.periode === 'harian') out.push(['⏰', '#FCEBCB', '<b>' + h(x.nama) + '</b> hari ini sisa <b>' + rp(bt - pk) + '</b>.']);
    else if (p >= 80) out.push(['🟠', '#FCEBCB', '<b>' + h(x.nama) + '</b> sudah terpakai <b>' + p + '%</b> ' + labelPer(x.periode, 2).toLowerCase() + '.']);
    else if (x.periode === 'bulanan' && p < 60) out.push(['👍', '#E2F0EE', '<b>' + h(x.nama) + '</b> masih aman, baru terpakai <b>' + p + '%</b> dari batas bulanan.']);
  });
  targetMilik(a).forEach(function(t){
    var nom = Number(t.nominal) || 0, k = Math.max(0, progresTarget(t.id));
    if (nom && k < nom && k / nom >= 0.75) out.push(['🎯', '#E3EEF4', 'Tinggal <b>' + rp(nom - k) + '</b> lagi untuk <b>' + h(t.nama) + '</b>. Sedikit lagi!']);
  });
  return out.slice(0, 3);
}
function kartuInsight(a){
  var list = insightList(a);
  if (!list.length) return '';
  return '<div class="card"><div class="h2r"><h3>Catatan untukmu</h3></div>' + list.map(function(x){
    return '<div class="ins"><span class="d" style="background:' + x[1] + '">' + x[0] + '</span><span>' + x[2] + '</span></div>';
  }).join('') + '</div>';
}

var KARTU = [['streak','Api streak (catat & nabung)'],['tabungan','Tujuan menabung'],['donat','Ke mana uangmu'],['tujuh','Grafik 7 hari'],['insight','Catatan untukmu'],['wallet','Wallet'],['anggaran','Anggaran'],['terbaru','Transaksi terbaru']];
function urutanKartu(){
  var u = S.ui.kartu, ada = {};
  if (!Array.isArray(u)) u = KARTU.map(function(k){ return {k:k[0], on:k[0] !== 'terbaru'}; });
  u = u.filter(function(x){ if (ada[x.k] || !KARTU.some(function(k){ return k[0] === x.k; })) return false; ada[x.k] = 1; return true; });
  KARTU.forEach(function(k){ if (!ada[k[0]]) u.push({k:k[0], on:false}); });
  return u;
}
function heroHome(a, total, tab, masuk, keluar){
  var nm = A[S.me] ? A[S.me].nama : '', html = '<div class="hero"><span class="sun"></span><div class="h-top">' + switchBtn() +
    '<button class="h-btn" data-act="reload" aria-label="Muat ulang">' + SVG.reload + '</button></div>' +
    '<div class="hi">Hi, ' + h(nm) + ' 👋</div>' +
    '<div class="h-month"><button data-act="bulan" data-v="-1" aria-label="Bulan sebelumnya">‹</button><b>' + namaBulan(S.month) + '</b><button data-act="bulan" data-v="1" aria-label="Bulan berikutnya">›</button></div>' +
    '<div class="h-l">Saldo bersih ' + h(A[a].nama) + '</div><div class="h-v num">' + uang(total) + eyeBtn() + '</div>' +
    (tab > 0 ? '<div class="h-sub">termasuk tabungan ' + uang(tab) + '</div>' : '');
  if (S.month === ym(today())) {
    var t = tglObj(today()), sisaHari = daysIn(S.month) - t.getDate() + 1, bebas = total - tab, aman = Math.floor(bebas / sisaHari / 500) * 500;
    html += '<div class="aman"><span class="e">' + (aman > 0 ? '✓' : '!') + '</span><span>' + (aman > 0 ? 'Aman dipakai <b class="num">' + uang(aman) + '/hari</b><br>sampai akhir bulan · ' + sisaHari + ' hari lagi' + (tab > 0 ? ', tanpa tabungan' : '') : 'Uang bebas pakai sedang <b>habis</b>.<br>Kurangi pengeluaran dulu ya.') + '</span></div>';
  }
  html += '<div class="h-mini"><div><span class="ar" style="background:#2E8C85;color:#fff">↓</span><span><small>Pemasukan</small><b class="num">' + uang(masuk) + '</b></span></div>' +
    '<div><span class="ar" style="background:#8C2F45;color:#fff">↑</span><span><small>Pengeluaran</small><b class="num">' + uang(keluar) + '</b></span></div></div></div>';
  return html;
}
function viewHome(){
  var a = S.akun, m = S.month, sal = saldoMap();
  var total = dompetAkun(a).reduce(function(x, d){ return x + (sal[d.id] || 0); }, 0);
  var bulan = S.tx.filter(function(t){ return t.akun === a && ym(t.tanggal) === m; });
  var masuk = jumlahBy(bulan, function(t){ return t.jenis === 'Pemasukan'; });
  var keluar = jumlahBy(bulan, function(t){ return t.jenis === 'Pengeluaran'; });
  var html = heroHome(a, total, totalTabungan(a), masuk, keluar) + '<div class="wrap lift">';
  urutanKartu().forEach(function(x){
    if (!x.on) return;
    var c = '';
    if (x.k === 'streak') c = kartuStreak(a);
    else if (x.k === 'tabungan') c = kartuTabungan(a);
    else if (x.k === 'donat') c = kartuDonat(a, bulan);
    else if (x.k === 'tujuh') c = kartuTujuhHari(a);
    else if (x.k === 'insight') c = kartuInsight(a);
    else if (x.k === 'wallet') c = kartuWallet(a);
    else if (x.k === 'anggaran') c = kartuAnggaran(a);
    else if (x.k === 'terbaru') { var list = urut(S.tx.filter(function(t){ return terkait(t, a); })).slice(0, 5); c = '<div class="card"><div class="h2r"><h3>Transaksi terbaru</h3><button class="lnk2" data-act="nav" data-v="riwayat">Semua ›</button></div>' + (list.length ? list.map(txRow).join('') : '<div class="empty">Belum ada catatan.</div>') + '</div>'; }
    html += c;
  });
  return html + '</div>';
}

/* ---------- transaksi ---------- */
function viewRiwayat(){
  var a = S.akun, f = S.filter;
  var list = urut(S.tx.filter(function(t){
    if (!terkait(t, a) || ym(t.tanggal) !== S.month) return false;
    if (f === 'keluar') return t.jenis === 'Pengeluaran';
    if (f === 'masuk') return t.jenis === 'Pemasukan';
    if (f === 'transfer') return t.jenis === 'Transfer';
    return true;
  }));
  var html = pageHead('Transaksi') + '<div class="wrap">' + monthNav() + '<div class="pills">' + [['semua','Semua'],['keluar','Pengeluaran'],['masuk','Pemasukan'],['transfer','Transfer']].map(function(x){
    return '<button class="' + (f === x[0] ? 'on' : '') + '" data-act="filter" data-v="' + x[0] + '">' + x[1] + '</button>';
  }).join('') + '</div>';
  if (!list.length) return html + '<div class="card"><div class="empty">Tidak ada catatan di bulan ini.</div></div></div>';
  var grup = {};
  list.forEach(function(t){ (grup[t.tanggal] = grup[t.tanggal] || []).push(t); });
  Object.keys(grup).sort().reverse().forEach(function(tg){
    var out = jumlahBy(grup[tg], function(t){ return t.jenis === 'Pengeluaran'; });
    html += '<div class="day"><span>' + tglPanjang(tg) + '</span><span class="num">' + (out ? '−' + rp(out) : '') + '</span></div><div class="card" style="padding-top:4px;padding-bottom:4px">' + grup[tg].map(txRow).join('') + '</div>';
  });
  return html + '</div>';
}

/* ---------- laporan baru ---------- */
function rangeLap(){
  var L = S.lap, t0 = today();
  if (L.preset === '30') return [geserTgl(t0, -29), t0, '30 hari terakhir'];
  if (L.preset === 'tahun') return [t0.slice(0, 4) + '-01-01', t0.slice(0, 4) + '-12-31', 'Tahun ' + t0.slice(0, 4)];
  if (L.preset === 'kustom' && L.dari && L.sampai) return [L.dari <= L.sampai ? L.dari : L.sampai, L.dari <= L.sampai ? L.sampai : L.dari, tglPendek(L.dari) + ' – ' + tglPendek(L.sampai)];
  return [S.month + '-01', S.month + '-' + pad(daysIn(S.month)), namaBulan(S.month)];
}
function cocokKat(t){ var k = S.lap.kat; return !k || t.kantong === k; }
function viewLaporan(){
  S.lap = S.lap || {preset:'bulan', dari:'', sampai:'', kat:'', mode:'bulan', buka:{}};
  var L = S.lap, a = S.akun, r = rangeLap();
  var data = S.tx.filter(function(t){ return t.akun === a && t.tanggal >= r[0] && t.tanggal <= r[1] && cocokKat(t); });
  var masuk = jumlahBy(data, function(t){ return t.jenis === 'Pemasukan'; });
  var keluar = jumlahBy(data, function(t){ return t.jenis === 'Pengeluaran'; });
  var html = pageHead('Laporan') + '<div class="wrap">';
  html += '<div class="pills">' + [['bulan','Per bulan'],['30','30 hari'],['tahun','Tahun ini'],['kustom','Pilih tanggal']].map(function(p){
    return '<button class="' + (L.preset === p[0] ? 'on' : '') + '" data-act="lap-preset" data-v="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div>';
  if (L.preset === 'bulan') html += monthNav();

function grafikTren(a){
  var mode = S.lap.mode, t0 = today(), per = [];
  if (mode === 'hari') for (var i = 13; i >= 0; i--) { var d = geserTgl(t0, -i); per.push([d, d, String(tglObj(d).getDate())]); }
  else if (mode === 'minggu') for (var j = 7; j >= 0; j--) { var w = geserTgl(senin(t0), -7 * j), dw = tglObj(w); per.push([w, geserTgl(w, 6), dw.getDate() + '/' + (dw.getMonth() + 1)]); }
  else if (mode === 'tahun') for (var y = 3; y >= 0; y--) { var yy = String(+t0.slice(0, 4) - y); per.push([yy + '-01-01', yy + '-12-31', yy]); }
  else for (var m = 5; m >= 0; m--) { var mo = shiftM(ym(t0), -m); per.push([mo + '-01', mo + '-' + pad(daysIn(mo)), BLN[+mo.slice(5, 7) - 1]]); }
  var val = per.map(function(p){
    var f = function(jn){ return jumlahBy(S.tx, function(t){ return t.akun === a && t.jenis === jn && t.tanggal >= p[0] && t.tanggal <= p[1] && cocokKat(t); }); };
    return [f('Pemasukan'), f('Pengeluaran')];
  });
  var mx = Math.max.apply(null, val.map(function(v){ return Math.max(v[0], v[1]); }).concat([1]));
  var W = 330, H = 150, n = per.length, gw = W / n, bw = Math.min(14, gw / 2.6), svg = '';
  [20, 65, 110].forEach(function(yv){ svg += '<line x1="0" y1="' + yv + '" x2="' + W + '" y2="' + yv + '" stroke="var(--line)"/>'; });
  per.forEach(function(p, k){
    var cx = gw * k + gw / 2, h1 = Math.round(val[k][0] / mx * 105), h2 = Math.round(val[k][1] / mx * 105);
    if (h1) svg += '<rect x="' + (cx - bw - 1).toFixed(1) + '" y="' + (128 - h1) + '" width="' + bw.toFixed(1) + '" height="' + h1 + '" rx="3" fill="#2E8C85"><title>Pemasukan ' + rp(val[k][0]) + '</title></rect>';
    if (h2) svg += '<rect x="' + (cx + 1).toFixed(1) + '" y="' + (128 - h2) + '" width="' + bw.toFixed(1) + '" height="' + h2 + '" rx="3" fill="#D9573B"><title>Pengeluaran ' + rp(val[k][1]) + '</title></rect>';
    svg += '<text x="' + cx.toFixed(1) + '" y="144" text-anchor="middle" font-size="10" fill="var(--muted)">' + h(p[2]) + '</text>';
  });
  var adaData = val.some(function(v){ return v[0] || v[1]; });
  return (adaData ? '<svg class="chart" width="100%" viewBox="0 0 ' + W + ' ' + H + '" style="display:block">' + svg + '</svg>' : '<div class="empty">Belum ada data untuk grafik.</div>') +
    '<div class="legend2"><span><i style="background:#2E8C85"></i>Pemasukan</span><span><i style="background:#D9573B"></i>Pengeluaran</span><span>maks ' + singkat(mx) + '</span></div>';
}

/* ---------- unggah ikon ---------- */
function unggahIkon(input){
  var k = input.getAttribute('data-ikon'), file = input.files && input.files[0]; if (!file) return;
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      var N = 120, c = document.createElement('canvas'); c.width = N; c.height = N;
      var g = c.getContext('2d'), sc = Math.min(N / img.width, N / img.height);
      var w = img.width * sc, hh = img.height * sc;
      g.drawImage(img, (N - w) / 2, (N - hh) / 2, w, hh);
      var data = c.toDataURL('image/png');
      if (data.length > 45000) { var c2 = document.createElement('canvas'); c2.width = N; c2.height = N; var g2 = c2.getContext('2d'); g2.fillStyle = '#fff'; g2.fillRect(0, 0, N, N); g2.drawImage(c, 0, 0); data = c2.toDataURL('image/jpeg', .85); }
      if ($('pv-ic')) $('pv-ic').innerHTML = '<span class="typing">Mengunggah…</span>';
      call('simpanIkon', data).then(function(id){
        S.ikon[id] = data; $('f_' + k).value = id; if ($('del_' + k)) $('del_' + k).classList.remove('hidden'); if (input.parentNode && input.parentNode.firstChild.nodeType === 3) input.parentNode.firstChild.nodeValue = '📷 Ganti foto'; updPreview(); toast('Foto terpasang. Jangan lupa Simpan.');
      }).catch(function(e){ updPreview(); toast(msg(e)); });
    };
    img.onerror = function(){ toast('Gambar tidak bisa dibaca'); };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

    var id = img.getAttribute('data-foto'); if (!id) return;
    if (FOTO[id]) { if (img.getAttribute('src') !== FOTO[id]) img.src = FOTO[id]; return; }

/* ---------- foto: perkecil lalu unggah ---------- */
function kecilkanFoto(file, maks){
  return new Promise(function(res, rej){
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var sc = Math.min(1, maks / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function(){ rej(new Error('Foto tidak bisa dibaca')); };
      img.src = rd.result;
    };
    rd.onerror = function(){ rej(new Error('Foto tidak bisa dibaca')); };
    rd.readAsDataURL(file);
  });
}
function unggahFotoFile(file){
  return kecilkanFoto(file, 1280).then(function(d){ return call('unggahFoto', d).then(function(id){ FOTO[id] = d; fotoCache(id, d); return id; }); });
}
function fotoCache(id, data){
  try {
    if (!window.caches) return Promise.resolve(null);
    var key = './__foto/' + encodeURIComponent(id);
    return caches.open('catetin-foto').then(function(c){
      if (data) return c.put(key, new Response(data)).then(function(){ return data; });
      return c.match(key).then(function(r){ return r ? r.text() : null; });
    }).catch(function(){ return null; });
  } catch(e){ return Promise.resolve(null); }
}

    case 'edit-sub': editSub(el.getAttribute('data-k'), id); break;
    case 'form-target': editTarget(id); break;
    case 'edit-toko': editToko(id); break;
    case 'warna': $('f_' + el.getAttribute('data-k')).value = v; [].forEach.call(el.parentNode.children, function(c){ c.classList.toggle('on', c === el); }); updPreview(); break;
    case 'pick-icon': $('f_' + el.getAttribute('data-k')).value = v; [].forEach.call(el.parentNode.children, function(c){ c.classList.toggle('on', c === el); }); updPreview(); break;
    case 'hapus-ikon': { var k = el.getAttribute('data-k'); $('f_' + k).value = ''; el.classList.add('hidden'); updPreview(); break; }
    case 'form-simpan': if (S.form) S.form.onSave(bacaForm()); break;
    // berdua
    case 'timeline': S.view = 'timeline'; render(); window.scrollTo(0, 0); break;
    case 'agenda': bukaAgenda(id); break;
    case 'agenda-baru': formAgenda(); break;
    case 'agenda-edit': formAgenda(id); break;
    case 'agenda-hapus': hapusKlik(el, function(){ call('hapusItem', 'agenda', id).then(function(){ S.agenda = S.agenda.filter(function(x){ return x.id !== id; }); tutup(); render(); toast('Agenda dihapus'); }).catch(function(e){ toast(msg(e)); }); }); break;
    case 'ag-jenis': ambilAg(); S.ag.jenis = v; renderFormAgenda(); break;
    case 'ag-simpan': simpanAgenda(); break;
    case 'jadi-momen': { var ag = S.agenda.filter(function(x){ return x.id === id; })[0]; if (ag) formMomen(null, {judul:ag.judul, tanggal:ag.tanggal, lokasi:ag.lokasi || '', jenis:ag.jenis, agenda:ag.id}); break; }
    case 'momen': bukaMomen(id); break;
    case 'momen-baru': formMomen(); break;
    case 'momen-edit': formMomen(id); break;
    case 'momen-hapus': hapusKlik(el, function(){ call('hapusItem', 'momen', id).then(function(){ S.momen = S.momen.filter(function(x){ return x.id !== id; }); tutup(); render(); toast('Kenangan dihapus'); }).catch(function(e){ toast(msg(e)); }); }); break;
    case 'mo-jenis': ambilMo(); S.mo.jenis = v; renderFormMomen(); break;
    case 'mo-hapus-foto': ambilMo(); S.mo.foto.splice(+v, 1); renderFormMomen(); break;
    case 'mo-simpan': simpanMomen(); break;
    case 'jadi-sampul': tutup(); setSampul(id); break;
    case 'atur-berdua': bukaAturBerdua(); break;
    case 'bd-simpan': S.cfg.berdua = S.cfg.berdua || {}; S.cfg.berdua.sejak = $('bd-sejak').value || ''; tutup(); simpanCfg(); render(); break;
    case 'form-hapus':
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Ketuk sekali lagi untuk menghapus'; break; }
      if (S.form && S.form.onDelete) S.form.onDelete(); break;
  }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.id === 'cari-pk') { filterList('#pk-list .ck[data-name]', t.value); [].forEach.call(document.querySelectorAll('.pk-g'), function(g){ var q = norm(t.value).trim(); g.classList.toggle('hidden', !!q && g.getAttribute('data-name').indexOf(q) < 0); }); return; }
  if (t.id === 'cari-kat') { filterList('#sheet .row[data-name]', t.value); return; }
  if (t.getAttribute && t.getAttribute('data-color')) {
    var ck = t.getAttribute('data-color'), lab = t.parentNode; $('f_' + ck).value = t.value;
    [].forEach.call(lab.parentNode.children, function(c){ c.classList.toggle('on', c === lab); });
    lab.style.background = t.value; lab.style.borderStyle = 'solid'; if (lab.firstChild && lab.firstChild.nodeType === 3) lab.firstChild.nodeValue = '';
    updPreview(); return;
  }
  if (S.form && S.form.preview && (t.id === 'f_nama' || t.id === 'f_inisial')) updPreview();
  if (t.hasAttribute && t.hasAttribute('data-money')) { var n = digits(t.value); t.value = n ? n.toLocaleString('id-ID') : ''; }
});
document.addEventListener('change', function(e){
  var t = e.target; if (!t.getAttribute) return;
  if (t.getAttribute('data-ikon')) unggahIkon(t);
  else if (t.getAttribute('data-mofoto')) tambahFotoMomen(t.files);
  else if (t.id === 'lap-kat') { S.lap.kat = t.value; render(); }
  else if (t.id === 'lap-dari' || t.id === 'lap-sampai') { S.lap.dari = $('lap-dari').value; S.lap.sampai = $('lap-sampai').value; render(); }
  else if (t.getAttribute('data-sampul') && t.files && t.files[0]) {
    toast('Mengunggah foto sampul…'); if ($('cv-h')) $('cv-h').textContent = 'Mengunggah…';
    unggahFotoFile(t.files[0]).then(function(id){ tutup(); setSampul(id, true); toast('Foto sampul diganti ✓'); }).catch(function(err){ toast(msg(err)); render(); });
  }
});
['lg-email','lg-sandi'].forEach(function(i){ $(i).addEventListener('keydown', function(e){ if (e.key === 'Enter') lgMasuk(); }); });
['dt-kode','dt-sandi2'].forEach(function(i){ $(i).addEventListener('keydown', function(e){ if (e.key === 'Enter') dtSimpan(); }); });
$('chat-form').addEventListener('submit', function(e){ e.preventDefault(); var i = $('chat-in'); kirimChat(i.value); i.value = ''; });
document.addEventListener('visibilitychange', function(){ if (!document.hidden && S.cfg) muatUlang(true); });

/* ---------- mulai ---------- */
muatUI(); terapkanUI();
S.hide = load('kk_hide') === '1' || !!S.ui.sembunyi;
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', terapkanUI); } catch(e){}
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(function(){}); }
muatAwal();
</script>
